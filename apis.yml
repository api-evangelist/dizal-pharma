name: Dizal Pharma
description: >-
  Dizal Pharma (Dizal (Jiangsu) Pharmaceutical Co., Ltd.) is a clinical-stage
  biopharmaceutical company focused on discovering and developing novel
  medicines in oncology and immunology. Originating in 2017 from research
  capabilities established in China, the company operates research and
  development across Shanghai and Wuxi (Jiangsu), China, and is listed on the
  Shanghai Stock Exchange STAR Market (ticker 688192). Dizal's most advanced
  programs include sunvozertinib (DZD9008), an oral EGFR exon 20 insertion
  inhibitor for non-small cell lung cancer marketed as Zegfrovy, and
  golidocitinib (DZD4205), a selective JAK1 inhibitor developed for
  relapsed/refractory peripheral T-cell lymphoma. Dizal Pharma was surfaced in
  the API Evangelist network as a portfolio company of the venture firm
  HongShan (formerly Sequoia Capital China). As a pharmaceutical developer it
  publishes a corporate marketing and investor-facing website but does not
  expose a public developer platform, API program, or machine-readable API
  artifacts at this time; this profile captures the company identity for the
  network.
